<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>静雅斋数学|使用目录</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/themes/vue.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar-folder.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
  a { text-decoration:none; font-size:16px; }
  a:link    {color:green;}
  a:visited {color:grey;}
  a:hover   {color:red;}
  a:active  {color:yellow;}
  :root { --base-font-size: 16px; }
  .app-name-link > img { width: 65%; }
</style>
</head>
<body>
<div id="app">Loading...，请您稍候，精彩马上呈现</div>
  <!-- 内联 EditOnGithubPlugin -->
  <script>
    (function() {
      function EditOnGithubPlugin(repo) {
        return function(hook, vm) {
          hook.beforeEach(function(html) {
            var url = repo + vm.route.file;
            var editHtml = '[:memo: 编辑此页](' + url + ')\n\n';
            return editHtml + html;
          });
        };
      }
      window.EditOnGithubPlugin = {
        create: function(repo) {
          return EditOnGithubPlugin(repo);
        }
      };
    })();
  </script>

  <script>
    window.$docsify = {
      name: '静雅斋数学',
      logo:'/_media/992978-20210118214725059-1705326463.png',
      repo: 'https://github.com/wanghai0666/docsify-CnBlogs',
      loadNavbar: true,
      homepage: 'README.md',
      el: '#app',
      coverpage: true,
      onlyCover: true,
      topMargin: 10,
      loadSidebar: true,
      sidebarDisplayLevel: 2,
      auto2top: true,
      maxLevel: 4,
      subMaxLevel: 3,
      mergeNavbar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      count: {
        countable:true,
        fontsize:'0.9em',
        color:'rgb(90,90,90)',
        language:'chinese'
      },
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '用关键词搜索...',
        noData: '找不到结果',
        depth: 4,
      },
      plugins: [
        EditOnGithubPlugin.create('https://github.com/wanghai0666/docsify-CnBlogs/blob/master/'),
        function(hook) {
          var footer = [
            '<hr/>',
            '<footer>',
            '<span><a href="https://github.com/wanghai0666">静雅斋数学     Made by WangHai  </a>  &copy; 2016 - 2026 .</span><br/>',
            '<span>Published  with  <a href="https://github.com/docsifyjs/docsify" target="_blank"> docsify </a>.</span>',
            '</footer>'
          ].join('');
          hook.afterEach(function(html) {
            return html + footer;
          });
        },
      ],
    }
  </script>

  <!-- docsify 主库 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>

  <!-- 插件 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@2.0.2/dist/docsify-katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/zoom-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count@1.1.0/dist/countable.min.js"></script>
  <!-- 去掉了 docsify-pagination -->

  <!-- 图片居中 -->
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      var imgs = document.querySelectorAll('img');
      imgs.forEach(function(img) {
        var center = document.createElement('center');
        img.parentNode.insertBefore(center, img);
        center.appendChild(img);
      });
    });
  </script>
</body>
</html>
